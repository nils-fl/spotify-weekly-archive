<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="spotify-weekly-archive">
  <title>spotify-weekly-archive</title>
  <!-- Weeks accumulating: each bar a little taller and a little more present
       than the one before it, the newest at full strength.
       Mid-tone teal reads on both light and dark backgrounds, so one file
       serves both GitHub themes. Deliberately not Spotify green.
       Depth is opacity only, so the mark survives a 16px favicon. -->
  <g fill="#14b8a6">
    <rect x="2"  y="45" width="8" height="14" rx="4" opacity="0.35"/>
    <rect x="15" y="35" width="8" height="24" rx="4" opacity="0.5"/>
    <rect x="28" y="25" width="8" height="34" rx="4" opacity="0.68"/>
    <rect x="41" y="15" width="8" height="44" rx="4" opacity="0.84"/>
    <rect x="54" y="5"  width="8" height="54" rx="4"/>
  </g>
</svg>
