<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="spotify-weekly-archive">
  <title>spotify-weekly-archive</title>
  <!-- Mid-tone teal reads on both light and dark backgrounds, so one file
       serves both GitHub themes. Deliberately not Spotify green. -->
  <g fill="none" stroke="#14b8a6" stroke-width="3">
    <rect x="4.5" y="4.5" width="55" height="55" rx="15"/>
  </g>
  <!-- A week of tracks. Depth comes from opacity only, keeping the mark
       legible when scaled down to a 16px favicon. -->
  <g fill="#14b8a6">
    <rect x="16" y="26" width="4" height="12" rx="2" opacity="0.4"/>
    <rect x="23" y="21" width="4" height="22" rx="2" opacity="0.65"/>
    <rect x="30" y="17" width="4" height="30" rx="2"/>
    <rect x="37" y="23" width="4" height="18" rx="2" opacity="0.65"/>
    <rect x="44" y="27" width="4" height="10" rx="2" opacity="0.4"/>
  </g>
</svg>
